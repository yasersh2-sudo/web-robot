<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Emotion Display</title>
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <main class="display" data-emotion="neutral">
      <section class="face" aria-label="Robot emotion display">
        <div class="eyebrows" aria-hidden="true">
          <span class="brow brow-left"></span>
          <span class="brow brow-right"></span>
        </div>
        <div class="eyes">
          <div class="eye eye-left">
            <div class="pupil"></div>
          </div>
          <div class="eye eye-right">
            <div class="pupil"></div>
          </div>
        </div>
        <svg class="mouth" viewBox="0 530 469.333 265" aria-hidden="true">
          <g class="mouth-sprite-layer"></g>
        </svg>
        <img class="mustache" src="./mustache.svg" alt="" aria-hidden="true">
      </section>
      <p id="emotion-label" class="status-text" aria-live="polite">neutral</p>
      <p id="connection-label" class="status-text">connecting</p>
    </main>
    <script src="./anime.iife.min.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
